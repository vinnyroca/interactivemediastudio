
<style>

  .post-content img:not(.no-lightbox),
  .page-content img:not(.no-lightbox),
  article img:not(.no-lightbox),
  main img:not(.no-lightbox) {
    cursor: zoom-in;
    transition: opacity 0.15s ease;
  }
  .post-content img:not(.no-lightbox):hover,
  .page-content img:not(.no-lightbox):hover,
  article img:not(.no-lightbox):hover,
  main img:not(.no-lightbox):hover {
    opacity: 0.9;
  }


  .lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 2rem;
    box-sizing: border-box;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease;
  }
  .lightbox-overlay.is-open {
    opacity: 1;
    visibility: visible;
  }
  .lightbox-overlay img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    cursor: zoom-out;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
  }
  .lightbox-close {
    position: absolute;
    top: 1rem;
    right: 1.5rem;
    color: #fff;
    font-size: 2.5rem;
    line-height: 1;
    background: none;
    cursor: pointer;
    opacity: 1;
  }
  .lightbox-close:hover {
    opacity: 1;
  }
</style>

<div class="lightbox-overlay" id="lightbox-overlay" aria-hidden="true">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <img id="lightbox-image" src="" alt="">
</div>

<script>
(function () {
  var selector = '.post-content img, .page-content img, article img, main img';
  var overlay = document.getElementById('lightbox-overlay');
  var overlayImg = document.getElementById('lightbox-image');
  var closeBtn = document.getElementById('lightbox-close');
  var lastFocused = null;

  function openLightbox(img) {
    overlayImg.src = img.src;
    overlayImg.alt = img.alt || '';
    overlay.classList.add('is-open');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    lastFocused = document.activeElement;
    closeBtn.focus();
  }

  function closeLightbox() {
    overlay.classList.remove('is-open');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    overlayImg.src = '';
    if (lastFocused) lastFocused.focus();
  }

  document.addEventListener('click', function (e) {
    var img = e.target.closest(selector);
    if (img && !img.classList.contains('no-lightbox')) {
      openLightbox(img);
    }
  });

  overlay.addEventListener('click', function (e) {
    closeLightbox();
  });

  closeBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    closeLightbox();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlay.classList.contains('is-open')) {
      closeLightbox();
    }
  });
})();
</script>

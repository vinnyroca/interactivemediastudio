---
layout: default
---
<div class="page-with-toc">
  <article class="post-content" id="post-content">
    {{ content }}
  </article>

  <aside class="toc-sidebar">
    <nav>


      <p class="toc-title">ON THIS PAGE</p>

      <ul class="toc-list" id="toc-list">

       
      </ul>
      <br>
      <div style="display: flex; align-items: center;  justify-content: space-between; ">
         {% if page.previous %}
      <span> <a href="{{ page.previous.url | relative_url }}">PREVIOUS </a></span>
           {% endif %}
               {% if page.next %}
      <span> <a href="{{ page.next.url | relative_url }}">NEXT </a></span>
           {% endif %}
      </div>
   

    </nav>
  </aside>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const headers = document.querySelectorAll("#post-content h2");
    const tocList = document.getElementById("toc-list");

    if (!headers.length) {
      document.querySelector(".toc-sidebar").style.display = "none";
      return;
    }

    function slugify(text) {
      return text
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, "")
        .replace(/\s+/g, "-");
    }

    headers.forEach(function (h) {
      if (!h.id) {
        h.id = slugify(h.textContent);
      }

      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#" + h.id;
      a.textContent = h.textContent;

      a.addEventListener("click", function (e) {
        e.preventDefault();
        const target = document.getElementById(h.id);
        if (target) {
          const headerOffset = 80;
          const targetPosition = target.getBoundingClientRect().top + window.pageYOffset;
          window.scrollTo({
            top: targetPosition - headerOffset,
            behavior: "smooth"
          });
          history.pushState(null, null, "#" + h.id);
        }
      });

      li.appendChild(a);
      tocList.appendChild(li);
    });
  });
</script>
